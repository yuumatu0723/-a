<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆる株日記 v10.0 Final</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --accent: #ffb7b2; --win: #ff5252; --lose: #4caf50; --bg: #fffcf9; }
        body { font-family: 'Hiragino Sans', sans-serif; background: var(--bg); margin: 0; padding-bottom: 100px; color: #444; }
        header { background: var(--accent); color: white; text-align: center; padding: 20px; font-weight: bold; border-radius: 0 0 25px 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .tab-content { display: none; padding: 15px; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* カレンダー */
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: white; padding: 12px; border-radius: 20px; border: 1px solid #eee; }
        .day { min-height: 85px; display: flex; flex-direction: column; align-items: center; border-radius: 12px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .day.selected { border-color: var(--accent); background: #fff5f0; }
        .day-num { font-size: 0.9rem; margin-top: 8px; font-weight: bold; }
        .day-profit { font-size: 0.65rem; font-weight: bold; margin-top: 5px; }

        /* 損益％表示の専用ボックス */
        .pct-box { font-size: 0.75rem; font-weight: 800; padding: 2px 8px; border-radius: 6px; color: white; display: inline-block; margin-top: 4px; }
        .win-bg { background: var(--win); }
        .lose-bg { background: var(--lose); }

        /* カード */
        .card { background: white; padding: 20px; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; }
        h3 { margin: 0 0 15px; font-size: 1.1rem; color: var(--accent); border-left: 5px solid var(--accent); padding-left: 12px; }

        /* 図解SVG */
        .svg-container { width: 100%; height: 100px; background: #fafafa; border-radius: 15px; display: flex; align-items: center; justify-content: center; margin: 10px 0; border: 1px dashed #ddd; }

        /* フォーム */
        .form-group { margin-bottom: 15px; }
        label { font-size: 0.8rem; font-weight: bold; color: #888; display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-size: 1rem; }
        textarea { resize: none; font-family: inherit; }
        
        button { background: var(--accent); color: white; border: none; padding: 18px; width: 100%; border-radius: 35px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 5px 0 #e59a96; transition: 0.1s; }
        button:active { transform: translateY(3px); box-shadow: 0 2px 0 #e59a96; }
        .btn-sub { background: #f0f0f0; color: #666; box-shadow: 0 5px 0 #ccc; }

        .nav { position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); display: flex; border-top: 1px solid #eee; height: 85px; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75rem; color: #bbb; cursor: pointer; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<header>📊 ゆる株日記 Master v10.0</header>

<div id="tab-cal" class="tab-content active">
    <div class="calendar" id="calendar"></div>
    <div id="daily-detail-area" style="margin-top:20px; display:none;">
        <div class="card">
            <h3 id="detail-date">詳細</h3>
            <div id="trade-list-inner"></div>
            <button onclick="openForm()">＋ 新規トレードを記録</button>
            <button class="btn-sub" onclick="document.getElementById('daily-detail-area').style.display='none'">閉じる</button>
        </div>
    </div>
</div>

<div id="tab-stats" class="tab-content">
    <div class="card" style="background: linear-gradient(135deg, var(--accent), #ffcfcc); color:white; border:none; text-align:center;">
        <div style="font-size:0.9rem; opacity:0.9;">累計損益合計</div>
        <div style="font-size:2.4rem; font-weight:bold;" id="grand-total">0円</div>
    </div>
    <div class="card"><h3>資産推移（累積）</h3><canvas id="profitChart" height="180"></canvas></div>
    <div id="holding-list"></div>
</div>

<div id="tab-dict" class="tab-content">
    <div id="dict-container"></div>
</div>

<div id="tab-entry" class="tab-content">
    <div class="card">
        <h3>トレード入力フォーム</h3>
        <div class="form-group"><label>銘柄名</label><input type="text" id="stock-name" placeholder="銘柄名（例：NTT）"></div>
        <div style="display:flex; gap:10px;" class="form-group">
            <div style="flex:1;"><label>買単価（円）</label><input type="number" id="buy-price" placeholder="150"></div>
            <div style="flex:1;"><label>売単価（円）</label><input type="number" id="sell-price" placeholder="160"></div>
        </div>
        <div class="form-group"><label>① 買った理由（根拠）</label><textarea id="buy-reason" rows="2" placeholder="移動平均線のゴールデンクロスなど"></textarea></div>
        <div class="form-group"><label>② 売った理由（利確・損切）</label><textarea id="sell-reason" rows="2" placeholder="目標達成、あるいはシナリオ崩壊など"></textarea></div>
        <div class="form-group"><label>③ 今回の学び・反省</label><textarea id="feedback" rows="2" placeholder="焦って飛び乗らなかったか？など"></textarea></div>
        <button onclick="saveTrade()">この内容を保存する</button>
        <button class="btn-sub" onclick="showTab('cal')">キャンセル</button>
    </div>
</div>

<nav class="nav">
    <div class="nav-item active" id="nav-cal" onclick="showTab('cal')">📅<br>日記</div>
    <div class="nav-item" id="nav-stats" onclick="showTab('stats')">📈<br>資産</div>
    <div class="nav-item" id="nav-dict" onclick="showTab('dict')">📖<br>図鑑</div>
</nav>

<script>
    // 圧倒的網羅性の図鑑データ
    const dictData = [
        { cat: '王道', name: 'ダブルボトム', desc: '二つの安値で底を打つ。上昇転換のサイン。', path: 'M10,20 L30,70 L50,40 L70,70 L90,20', col: '#ff5252' },
        { cat: '王道', name: '三尊（ヘッドアンドショルダー）', desc: '中央が高い3つの山。これが出たら下落注意。', path: 'M10,60 L25,40 L40,50 L50,20 L60,50 L75,40 L90,60', col: '#4caf50' },
        { cat: '王道', name: '逆三尊', desc: '三尊の逆。最強クラスの上昇サイン。', path: 'M10,20 L25,40 L40,30 L50,60 L60,30 L75,40 L90,20', col: '#ff5252' },
        { cat: '応用', name: 'カップウィズハンドル', desc: '取っ手付きのカップ。ブレイクで急騰の予感。', path: 'M10,20 C10,90 80,90 80,20 L90,30 L80,45', col: '#ff5252' },
        { cat: '応用', name: 'アセンディング・トライアングル', desc: '高値は一定、安値は切り上がる強気の三角保ち合い。', path: 'M10,20 L90,20 L10,70 L90,20', col: '#ff5252' },
        { cat: '注意', name: 'デッドキャットバウンス', desc: '大暴落後の一時的な戻り。騙されて買うとさらに落ちる。', path: 'M5,10 L30,85 L50,60 L70,90', col: '#4caf50' },
        { cat: '注意', name: 'ダブルトップ', desc: '二つの高値。天井を打って下落するサイン。', path: 'M10,60 L30,10 L50,40 L70,10 L90,60', col: '#4caf50' },
        { cat: '指標', name: 'RSI', desc: '買われすぎ(70%)・売られすぎ(30%)を示す。逆張りの指標。' },
        { cat: '指標', name: 'MACD', desc: '二本の線の交差でトレンドの発生と終焉を見極める。' },
        { cat: '用語', name: '窓埋め', desc: '急なギャップアップ・ダウンで開いた窓は、将来的に埋まりやすい。' },
        { cat: '用語', name: 'ナンピン', desc: '含み損が出た時に買い増し、平均単価を下げる。計画性が命。' },
        { cat: '用語', name: 'ドテン', desc: '持っている株を売り、即座に空売りを入れる（またはその逆）。' }
    ];

    let trades = JSON.parse(localStorage.getItem('kabu_v10_final') || '{}');
    let selectedDate = "", myChart = null;

    function showTab(tab) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        document.getElementById('nav-' + tab).classList.add('active');
        if(tab === 'cal') renderCalendar();
        if(tab === 'stats') { initChart(); updateGrandTotal(); }
        if(tab === 'dict') renderDict();
    }

    function renderCalendar() {
        const cal = document.getElementById('calendar'); cal.innerHTML = "";
        const now = new Date(); const y = now.getFullYear(); const m = now.getMonth();
        const days = new Date(y, m+1, 0).getDate();
        for(let i=1; i<=days; i++){
            const dStr = `${y}-${m+1}-${i}`;
            const el = document.createElement('div');
            el.className = 'day' + (i === now.getDate() ? ' today' : '') + (selectedDate === dStr ? ' selected' : '');
            let p = 0; if(trades[dStr]) trades[dStr].forEach(t => p += t.profit);
            el.innerHTML = `<div class="day-num">${i}</div>` + (p !== 0 ? `<div class="day-profit" style="color:${p>0?'var(--win)':'var(--lose)'}">${p>0?'+':''}${p.toLocaleString()}</div>` : "");
            el.onclick = () => { selectedDate = dStr; renderCalendar(); document.getElementById('daily-detail-area').style.display = 'block'; document.getElementById('detail-date').innerText = dStr + " の記録"; renderDayTrades(); };
            cal.appendChild(el);
        }
    }

    function renderDayTrades() {
        const inner = document.getElementById('trade-list-inner'); inner.innerHTML = "";
        const ds = trades[selectedDate] || [];
        ds.forEach((t, i) => {
            // 【重要】損益％の計算
            const pct = t.buy !== 0 ? ((t.profit / t.buy) * 100).toFixed(2) : "0.00";
            inner.innerHTML += `
                <div class="card" style="border-left:8px solid ${t.profit>=0?'var(--win)':'var(--lose)'}">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <strong>${t.name}</strong>
                        <div style="text-align:right;">
                            <span style="font-weight:900; font-size:1.2rem;">${t.profit.toLocaleString()}円</span><br>
                            <span class="pct-box ${t.profit>=0?'win-bg':'lose-bg'}">${t.profit>=0?'+':''}${pct}%</span>
                        </div>
                    </div>
                    <div style="font-size:0.75rem; color:#666; margin-top:12px; background:#f9f9f9; padding:12px; border-radius:12px;">
                        <div><b>単価:</b> 買 ${t.buy} / 売 ${t.sell}</div>
                        <div style="margin-top:6px;"><b>理由(買):</b> ${t.buyReason || '-'}</div>
                        <div><b>理由(売):</b> ${t.sellReason || '-'}</div>
                        <div style="color:var(--accent); margin-top:6px; font-weight:bold;"><b>学び・反省:</b> ${t.feedback || '-'}</div>
                    </div>
                    <button onclick="deleteTrade(${i})" class="btn-sub" style="padding:4px 12px; font-size:0.6rem; width:auto; margin-top:10px;">この取引を消去</button>
                </div>`;
        });
    }

    function saveTrade() {
        const name = document.getElementById('stock-name').value;
        const buy = parseFloat(document.getElementById('buy-price').value) || 0;
        const sell = parseFloat(document.getElementById('sell-price').value) || 0;
        if(!name || buy === 0) return alert("銘柄名と買値を正しく入力してください");
        
        if(!trades[selectedDate]) trades[selectedDate] = [];
        trades[selectedDate].push({
            name, buy, sell, profit: sell - buy,
            buyReason: document.getElementById('buy-reason').value,
            sellReason: document.getElementById('sell-reason').value,
            feedback: document.getElementById('feedback').value
        });
        localStorage.setItem('kabu_v10_final', JSON.stringify(trades));
        showTab('cal');
    }

    function renderDict() {
        const container = document.getElementById('dict-container'); container.innerHTML = "<h3>📖 トレード戦略・形状図鑑</h3>";
        dictData.forEach(item => {
            let svg = item.path ? `<div class="svg-container"><svg width="120" height="80" viewBox="0 0 100 80"><path d="${item.path}" fill="none" stroke="${item.col}" stroke-width="5" stroke-linecap="round"/></svg></div>` : "";
            container.innerHTML += `<div class="card"><small style="color:var(--accent); font-weight:bold;">${item.cat}</small><h4 style="margin:5px 0;">${item.name}</h4>${svg}<p style="font-size:0.8rem; line-height:1.4;">${item.desc}</p></div>`;
        });
    }

    function updateGrandTotal() {
        let total = 0; Object.keys(trades).forEach(d => trades[d].forEach(t => total += t.profit));
        document.getElementById('grand-total').innerText = total.toLocaleString() + "円";
    }

    function initChart() {
        const ctx = document.getElementById('profitChart').getContext('2d');
        if(myChart) myChart.destroy();
        const sorted = Object.keys(trades).sort((a,b) => new Date(a) - new Date(b));
        let cum = 0; const labels = [], data = [];
        sorted.forEach(d => { let dp = 0; trades[d].forEach(t => dp += t.profit); cum += dp; labels.push(d.split('-').slice(1).join('/')); data.push(cum); });
        myChart = new Chart(ctx, { type: 'line', data: { labels, datasets: [{ data, borderColor: '#ffb7b2', backgroundColor: 'rgba(255,183,178,0.2)', fill: true, tension: 0.4 }] }, options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
    }

    function deleteTrade(index) {
        trades[selectedDate].splice(index, 1);
        if(trades[selectedDate].length === 0) delete trades[selectedDate];
        localStorage.setItem('kabu_v10_final', JSON.stringify(trades));
        renderDayTrades(); renderCalendar();
    }
    
    function openForm() { 
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-entry').classList.add('active'); 
    }
    
    renderCalendar();
</script>
</body>
</html>
