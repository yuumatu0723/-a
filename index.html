<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆる株日記</title>
    <style>
        :root {
            --main-bg: #fff9f5;
            --accent: #ffb7b2;
            --sub-accent: #ffdac1;
            --text-color: #5d5d5d;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--main-bg);
            color: var(--text-color);
            margin: 0;
            padding-bottom: 90px;
            overflow-x: hidden;
        }
        header { background: var(--accent); color: white; text-align: center; padding: 15px; font-weight: bold; border-radius: 0 0 20px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .tab-content { display: none; padding: 15px; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; background: white; padding: 15px; border-radius: 20px; border: 2px solid var(--sub-accent); }
        .day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; font-size: 0.9rem; position: relative; }
        .day:active { background: var(--sub-accent); }
        .today { background: var(--sub-accent); font-weight: bold; }
        .has-data::after { content: '●'; position: absolute; bottom: 2px; font-size: 8px; color: var(--accent); }

        .card { background: var(--card-bg); padding: 18px; border-radius: 20px; margin-bottom: 15px; border: 1px solid var(--sub-accent); box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        h3 { margin-top: 0; color: var(--accent); border-bottom: 2px solid var(--sub-accent); padding-bottom: 5px; }
        
        label { display: block; margin-top: 10px; font-size: 0.85rem; font-weight: bold; color: #888; }
        input, textarea { width: 100%; padding: 12px; margin: 5px 0 15px 0; border: 1px solid var(--sub-accent); border-radius: 12px; box-sizing: border-box; font-size: 1rem; background: #fff; -webkit-appearance: none; }
        textarea { height: 80px; resize: none; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { background: var(--accent); color: white; border: none; padding: 15px; width: 100%; border-radius: 25px; font-weight: bold; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 0 #e5a09c; transition: 0.1s; }
        button:active { transform: translateY(3px); box-shadow: none; }
        .btn-sub { background: #d1d1d1; box-shadow: 0 4px 0 #bbb; }

        .nav { position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.95); display: flex; border-top: 1px solid #eee; height: 70px; border-radius: 25px 25px 0 0; backdrop-filter: blur(5px); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75rem; color: #bbb; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        .icon { font-size: 1.6rem; }
    </style>
</head>
<body>

<header id="header-title">ゆる株日記</header>

<div id="tab-cal" class="tab-content active">
    <div class="calendar" id="calendar"></div>
    <p style="text-align:center; font-size:0.8rem; color:#aaa; margin-top:15px;">日付を選んで記録をつけてね</p>
    <div id="history-list" style="margin-top:20px;"></div>
</div>

<div id="tab-stats" class="tab-content">
    <div class="card" style="text-align:center;">
        <div style="font-size:0.9rem;">これまでのトータル利益</div>
        <div style="font-size:2rem; font-weight:bold; color:var(--accent);" id="total-profit">¥0</div>
    </div>
    <h3>保有中の株</h3>
    <div id="holding-list"></div>
    <div class="card">
        <h3>保有株を追加</h3>
        <label>銘柄名</label><input type="text" id="hold-name" placeholder="例: トヨタ">
        <label>取得単価 (¥)</label><input type="number" id="hold-price">
        <button onclick="addHolding()">リストに追加</button>
    </div>
</div>

<div id="tab-entry" class="tab-content">
    <div class="card">
        <h3 id="form-date">2026/05/13</h3>
        <label>銘柄名</label><input type="text" id="stock-name" placeholder="例: 楽天">
        <label>投資金額 (¥)</label><input type="number" id="buy-price" placeholder="0">
        <label>売却金額 (¥)</label><input type="number" id="sell-price" placeholder="0">
        <label>買った理由</label><textarea id="buy-reason" placeholder="なぜこのタイミングで？"></textarea>
        <label>売った理由</label><textarea id="sell-reason" placeholder="利確？損切り？"></textarea>
        <label>反省・考えたこと</label><textarea id="feedback" placeholder="次はどうする？"></textarea>
        
        <div class="btn-group">
            <button class="btn-sub" onclick="showTab('cal')">やめる</button>
            <button onclick="saveTrade()">保存する</button>
        </div>
    </div>
</div>

<div class="nav">
    <div class="nav-item active" id="nav-cal" onclick="showTab('cal')"><span class="icon">📅</span>カレンダー</div>
    <div class="nav-item" id="nav-stats" onclick="showTab('stats')"><span class="icon">💰</span>収益・保有</div>
</div>

<script>
    let trades = JSON.parse(localStorage.getItem('kabu_trades') || '{}');
    let holdings = JSON.parse(localStorage.getItem('kabu_holdings') || '[]');
    let selectedDate = "";

    function showTab(tab) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        
        if(tab === 'cal') {
            document.getElementById('tab-cal').classList.add('active');
            document.getElementById('nav-cal').classList.add('active');
            renderCalendar();
        } else if(tab === 'stats') {
            document.getElementById('tab-stats').classList.add('active');
            document.getElementById('nav-stats').classList.add('active');
            renderStats();
        } else if(tab === 'entry') {
            document.getElementById('tab-entry').classList.add('active');
        }
    }

    function renderCalendar() {
        const cal = document.getElementById('calendar');
        cal.innerHTML = "";
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        for(let i = 1; i <= daysInMonth; i++) {
            const dateStr = `${year}-${month + 1}-${i}`;
            const dayEl = document.createElement('div');
            dayEl.className = 'day';
            if(i === now.getDate()) dayEl.classList.add('today');
            if(trades[dateStr]) dayEl.classList.add('has-data');
            dayEl.innerText = i;
            dayEl.onclick = () => openEntry(dateStr);
            cal.appendChild(dayEl);
        }
    }

    function openEntry(date) {
        selectedDate = date;
        showTab('entry');
        document.getElementById('form-date').innerText = date;
        
        const data = trades[date] || {};
        document.getElementById('stock-name').value = data.name || "";
        document.getElementById('buy-price').value = data.buy || "";
        document.getElementById('sell-price').value = data.sell || "";
        document.getElementById('buy-reason').value = data.bReason || "";
        document.getElementById('sell-reason').value = data.sReason || "";
        document.getElementById('feedback').value = data.feedback || "";
    }

    function saveTrade() {
        const name = document.getElementById('stock-name').value;
        if(!name) { alert("銘柄名を入れてね！"); return; }

        const buy = parseFloat(document.getElementById('buy-price').value) || 0;
        const sell = parseFloat(document.getElementById('sell-price').value) || 0;
        
        trades[selectedDate] = {
            name: name,
            buy: buy,
            sell: sell,
            profit: sell - buy,
            bReason: document.getElementById('buy-reason').value,
            sReason: document.getElementById('sell-reason').value,
            feedback: document.getElementById('feedback').value
        };
        
        localStorage.setItem('kabu_trades', JSON.stringify(trades));
        alert("保存したよ！");
        showTab('cal');
    }

    function addHolding() {
        const name = document.getElementById('hold-name').value;
        const price = document.getElementById('hold-price').value;
        if(!name || !price) return;
        holdings.push({name, price});
        localStorage.setItem('kabu_holdings', JSON.stringify(holdings));
        renderStats();
        document.getElementById('hold-name').value = "";
        document.getElementById('hold-price').value = "";
    }

    function renderStats() {
        const list = document.getElementById('holding-list');
        list.innerHTML = "";
        holdings.forEach((h, index) => {
            list.innerHTML += `<div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                <div><strong>${h.name}</strong><br><small>取得価格: ¥${parseFloat(h.price).toLocaleString()}</small></div>
                <button style="width:auto; padding:8px 15px; margin:0;" class="btn-sub" onclick="removeHolding(${index})">売却</button>
            </div>`;
        });

        let total = 0;
        Object.values(trades).forEach(t => total += (t.profit || 0));
        document.getElementById('total-profit').innerText = `¥${total.toLocaleString()}`;
    }

    function removeHolding(i) {
        if(confirm("売却リストから削除する？")) {
            holdings.splice(i, 1);
            localStorage.setItem('kabu_holdings', JSON.stringify(holdings));
            renderStats();
        }
    }

    renderCalendar();
</script>
</body>
</html>
