<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆる株マネージャー Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --accent: #ffb7b2; --win: #ff5252; --lose: #4caf50; --bg: #fffcf9; }
        body { font-family: 'Hiragino Sans', sans-serif; background: var(--bg); margin: 0; padding-bottom: 100px; color: #444; }
        header { background: var(--accent); color: white; text-align: center; padding: 15px; font-weight: bold; border-radius: 0 0 20px 20px; }
        .tab-content { display: none; padding: 15px; }
        .tab-content.active { display: block; }

        /* キャラクターエリア */
        .chara-box { background: white; border-radius: 20px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; border: 1px solid #eee; }
        .chara-img { font-size: 3rem; background: #fff5f0; border-radius: 50%; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; }
        .chara-msg { font-size: 0.85rem; font-weight: bold; position: relative; background: #f0f0f0; padding: 10px; border-radius: 10px; flex: 1; }

        /* カレンダー */
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: white; padding: 10px; border-radius: 15px; border: 1px solid #eee; }
        .day { min-height: 75px; display: flex; flex-direction: column; align-items: center; border-radius: 10px; cursor: pointer; background: #fafafa; border: 1.5px solid transparent; }
        .day.selected { border-color: var(--accent); background: #fff5f0; }
        .day-num { font-size: 0.8rem; margin-top: 4px; }
        .day-info { font-size: 0.55rem; font-weight: bold; text-align: center; width: 100%; overflow: hidden; }

        /* グラフ切替ボタン */
        .btn-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .btn-sm { flex: 1; padding: 8px; font-size: 0.7rem; background: #eee; border: none; border-radius: 8px; cursor: pointer; }
        .btn-sm.active { background: var(--accent); color: white; }

        /* カード系 */
        .card { background: white; padding: 18px; border-radius: 18px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 5px; color: white; }

        input, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        button.main-btn { background: var(--accent); color: white; border: none; padding: 15px; width: 100%; border-radius: 30px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        .nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #eee; height: 75px; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75rem; color: #bbb; cursor: pointer; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<header>📈 ゆる株マネージャー Pro</header>

<!-- キャラクターメッセージ -->
<div class="chara-box" style="margin: 15px;">
    <div class="chara-img" id="chara-face">🐣</div>
    <div class="chara-msg" id="chara-talk">侑希さん、今日の調子はどうかな？</div>
</div>

<div id="tab-cal" class="tab-content active">
    <div class="calendar" id="calendar"></div>
    <div id="daily-detail-area" style="margin-top:15px; display:none;">
        <div class="card">
            <h3 id="detail-date" style="margin:0 0 10px 0; font-size:1rem;"></h3>
            <div id="trade-list-inner"></div>
            <button class="main-btn" onclick="openForm()">＋ トレードを記録</button>
        </div>
    </div>
</div>

<div id="tab-stats" class="tab-content">
    <div class="card" style="background: linear-gradient(135deg, var(--accent), #ffcfcc); color:white; text-align:center; border:none;">
        <div style="font-size:0.8rem;">通算合計損益 / 回収率</div>
        <div style="font-size:1.8rem; font-weight:bold;" id="grand-total">0円</div>
        <div style="font-size:1.1rem;" id="grand-total-pct">0.00%</div>
    </div>
    
    <div class="card">
        <h3>分析グラフ</h3>
        <div class="btn-group">
            <button class="btn-sm active" id="btn-day" onclick="updateChartMode('day')">日次</button>
            <button class="btn-sm" id="btn-week" onclick="updateChartMode('week')">週次</button>
            <button class="btn-sm" id="btn-month" onclick="updateChartMode('month')">月次</button>
        </div>
        <canvas id="profitChart" height="200"></canvas>
    </div>
</div>

<div id="tab-entry" class="tab-content">
    <div class="card">
        <h3>トレード記録</h3>
        <label>銘柄名</label><input type="text" id="stock-name" placeholder="例：NTT">
        <div style="display:flex; gap:10px; margin-top:10px;">
            <div style="flex:1;"><label>買値</label><input type="number" id="buy-price"></div>
            <div style="flex:1;"><label>売値</label><input type="number" id="sell-price"></div>
        </div>
        <label style="display:block; margin-top:10px;">買った理由</label><textarea id="buy-reason" rows="2"></textarea>
        <label style="display:block; margin-top:10px;">売った理由</label><textarea id="sell-reason" rows="2"></textarea>
        <label style="display:block; margin-top:10px;">反省点</label><textarea id="feedback" rows="2"></textarea>
        <button class="main-btn" onclick="saveTrade()">この内容で保存</button>
        <button style="background:none; border:none; color:#999; width:100%; margin-top:10px;" onclick="showTab('cal')">キャンセル</button>
    </div>
</div>

<nav class="nav">
    <div class="nav-item active" id="nav-cal" onclick="showTab('cal')">📅<br>カレンダー</div>
    <div class="nav-item" id="nav-stats" onclick="showTab('stats')">📊<br>総損益</div>
</nav>

<script>
    let trades = JSON.parse(localStorage.getItem('yuru_kabu_pro') || '{}');
    let selectedDate = "", myChart = null, chartMode = 'day';

    function showTab(tab) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        document.getElementById('nav-' + tab).classList.add('active');
        if(tab === 'cal') renderCalendar();
        if(tab === 'stats') { updateGrandTotal(); initChart(); }
        updateChara();
    }

    function renderCalendar() {
        const cal = document.getElementById('calendar'); cal.innerHTML = "";
        const now = new Date(); const days = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
        for(let i=1; i<=days; i++){
            const dStr = `${now.getFullYear()}-${now.getMonth()+1}-${i}`;
            const el = document.createElement('div');
            el.className = 'day' + (selectedDate === dStr ? ' selected' : '');
            let p = 0, bTotal = 0, sTotal = 0;
            if(trades[dStr]) trades[dStr].forEach(t => { p += t.profit; bTotal += t.buy; sTotal += t.sell; });
            const rr = bTotal !== 0 ? ((sTotal/bTotal)*100).toFixed(1) : 0;
            
            el.innerHTML = `<div class="day-num">${i}</div>`;
            if(p !== 0) {
                el.innerHTML += `<div class="day-info" style="color:${p>0?'var(--win)':'var(--lose)'}">${p>0?'+':''}${p.toLocaleString()}</div>
                                 <div class="day-info" style="color:#888">${rr}%</div>`;
            }
            el.onclick = () => { selectedDate = dStr; renderCalendar(); document.getElementById('daily-detail-area').style.display = 'block'; document.getElementById('detail-date').innerText = dStr; renderDayTrades(); };
            cal.appendChild(el);
        }
    }

    function renderDayTrades() {
        const inner = document.getElementById('trade-list-inner'); inner.innerHTML = "";
        (trades[selectedDate] || []).forEach((t, i) => {
            const rr = t.buy !== 0 ? ((t.sell / t.buy) * 100).toFixed(1) : "0.0";
            inner.innerHTML += `
                <div style="border-bottom:1px solid #eee; padding:10px 0;">
                    <div style="display:flex; justify-content:space-between;">
                        <b>${t.name}</b>
                        <span style="color:${t.profit>=0?'var(--win)':'var(--lose)'}">${t.profit>=0?'+':''}${t.profit.toLocaleString()}円 (${rr}%)</span>
                    </div>
                    <div style="font-size:0.7rem; color:#888;">買:${t.buy} / 売:${t.sell}</div>
                </div>`;
        });
    }

    function saveTrade() {
        const n = document.getElementById('stock-name').value;
        const b = parseFloat(document.getElementById('buy-price').value) || 0;
        const s = parseFloat(document.getElementById('sell-price').value) || 0;
        if(!n || b === 0) return alert("銘柄と買値を入れてね！");
        if(!trades[selectedDate]) trades[selectedDate] = [];
        trades[selectedDate].push({ name:n, buy:b, sell:s, profit:s-b, buyReason:document.getElementById('buy-reason').value, sellReason:document.getElementById('sell-reason').value, feedback:document.getElementById('feedback').value });
        localStorage.setItem('yuru_kabu_pro', JSON.stringify(trades));
        showTab('cal');
    }

    function updateGrandTotal() {
        let pTotal = 0, bSum = 0, sSum = 0;
        Object.values(trades).flat().forEach(t => { pTotal += t.profit; bSum += t.buy; sSum += t.sell; });
        document.getElementById('grand-total').innerText = pTotal.toLocaleString() + "円";
        document.getElementById('grand-total-pct').innerText = bSum !== 0 ? "回収率: " + ((sSum/bSum)*100).toFixed(2) + "%" : "0.00%";
    }

    function updateChartMode(mode) {
        chartMode = mode;
        document.querySelectorAll('.btn-sm').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + mode).classList.add('active');
        initChart();
    }

    function initChart() {
        const ctx = document.getElementById('profitChart').getContext('2d');
        if(myChart) myChart.destroy();
        
        const sortedDates = Object.keys(trades).sort((a,b) => new Date(a) - new Date(b));
        let labels = [], data = [], tempMap = {};

        sortedDates.forEach(d => {
            let dayP = 0; trades[d].forEach(t => dayP += t.profit);
            let dateObj = new Date(d);
            let key = d;
            if(chartMode === 'week') {
                const startOfWeek = new Date(dateObj.setDate(dateObj.getDate() - dateObj.getDay()));
                key = startOfWeek.getMonth()+1 + "/" + startOfWeek.getDate() + "週";
            } else if(chartMode === 'month') {
                key = (dateObj.getMonth()+1) + "月";
            }
            tempMap[key] = (tempMap[key] || 0) + dayP;
        });

        labels = Object.keys(tempMap);
        data = Object.values(tempMap);

        myChart = new Chart(ctx, {
            type: 'bar',
            data: { labels, datasets: [{ label: '損益', data, backgroundColor: data.map(v => v>=0?'#ffb7b2':'#a8e6cf'), borderRadius: 5 }] },
            options: { plugins: { legend: { display: false } } }
        });
    }

    function updateChara() {
        const face = document.getElementById('chara-face');
        const msg = document.getElementById('chara-talk');
        let pTotal = 0; Object.values(trades).flat().forEach(t => pTotal += t.profit);
        
        if(pTotal > 0) { face.innerText = "✨"; msg.innerText = "侑希さん、絶好調だね！この調子で精密に攻めよう！"; }
        else if(pTotal < 0) { face.innerText = "🍵"; msg.innerText = "焦らずに行こう。反省点を次へのバネにするんだ！"; }
        else { face.innerText = "🐣"; msg.innerText = "まずは1回記録してみよう！応援してるよ！"; }
    }

    function openForm() { document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); document.getElementById('tab-entry').classList.add('active'); }
    renderCalendar();
</script>
</body>
</html>
