<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆる株日記 Pro v5.4</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --main-bg: #fff9f5;
            --accent: #ffb7b2;
            --sub-accent: #ffdac1;
            --text-color: #5d5d5d;
            --card-bg: #ffffff;
            --win-text: #e57373;
            --lose-text: #66bb6a;
            --trend-text: #4db6ac;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--main-bg); color: var(--text-color); margin: 0; padding-bottom: 90px; }
        header { background: var(--accent); color: white; text-align: center; padding: 15px; font-weight: bold; border-radius: 0 0 20px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .tab-content { display: none; padding: 15px; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* カレンダー */
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: white; padding: 8px; border-radius: 20px; border: 2px solid var(--sub-accent); }
        .day { min-height: 70px; display: flex; flex-direction: column; align-items: center; border-radius: 10px; cursor: pointer; padding-top: 4px; }
        .day.selected { border: 3px solid var(--accent) !important; background: #fff5f0; }
        .today { background: #fff0f0; font-weight: bold; }
        .day-num { font-size: 0.9rem; }
        .day-profit { font-size: 0.55rem; font-weight: bold; text-align: center; }
        .p-plus { color: var(--win-text); }
        .p-minus { color: var(--lose-text); }

        /* 資産カード */
        .total-card { background: linear-gradient(135deg, var(--accent), var(--sub-accent)); color: white; padding: 20px; border-radius: 20px; margin-bottom: 15px; text-align: center; }
        .total-val { font-size: 1.8rem; font-weight: bold; }

        .card { background: var(--card-bg); padding: 18px; border-radius: 20px; margin-bottom: 15px; border: 1px solid var(--sub-accent); box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        h3 { margin-top: 0; color: var(--accent); border-bottom: 2px solid var(--sub-accent); padding-bottom: 5px; font-size: 1.1rem; }
        
        /* チャート図解(SVG)用 */
        .chart-svg-box { width: 100%; height: 100px; background: #fdfdfd; border-radius: 12px; margin: 10px 0; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--sub-accent); }

        /* フォーム */
        label { font-size: 0.8rem; font-weight: bold; color: var(--accent); display: block; margin-top: 12px; }
        input, textarea { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid var(--sub-accent); border-radius: 12px; box-sizing: border-box; font-size: 1rem; }
        .hint { font-size: 0.7rem; color: #999; margin-bottom: 10px; }

        button { background: var(--accent); color: white; border: none; padding: 15px; width: 100%; border-radius: 25px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 0 #e5a09c; }
        .btn-sub { background: #d1d1d1; box-shadow: 0 4px 0 #bbb; }

        .nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #eee; height: 75px; border-radius: 25px 25px 0 0; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; color: #bbb; cursor: pointer; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<header>ゆる株日記 Pro v5.4</header>

<div id="tab-cal" class="tab-content active">
    <div class="calendar" id="calendar"></div>
    <div id="daily-detail-area" style="margin-top:20px; display:none;">
        <div class="card">
            <h3 id="detail-date">日付</h3>
            <div id="trade-list-inner"></div>
            <button onclick="openForm()">＋ この日に記録を追加</button>
            <button class="btn-sub" onclick="document.getElementById('daily-detail-area').style.display='none'">閉じる</button>
        </div>
    </div>
</div>

<div id="tab-stats" class="tab-content">
    <div class="total-card"><div>通算損益</div><div class="total-val" id="grand-total">0円</div></div>
    <div class="card"><h3>損益推移</h3><div style="height:150px;"><canvas id="profitChart"></canvas></div></div>
    <div id="holding-list"></div>
    <div class="card">
        <h3>保有株の追加</h3>
        <input type="text" id="hold-name" placeholder="例：トヨタ自動車">
        <input type="number" id="hold-price" placeholder="買値 (単価)">
        <input type="number" id="hold-current" placeholder="現在値 (単価)">
        <button onclick="addHolding()">リストに追加</button>
    </div>
</div>

<div id="tab-dict" class="tab-content">
    <div id="dict-container"></div>
</div>

<div id="tab-entry" class="tab-content">
    <div class="card">
        <h3 id="entry-title">新規記録</h3>
        
        <label>銘柄名</label>
        <input type="text" id="stock-name" placeholder="例：楽天グループ (4755)">
        
        <div style="display:flex; gap:10px;">
            <div style="flex:1;"><label>買値</label><input type="number" id="buy-price" placeholder="1000"></div>
            <div style="flex:1;"><label>売値</label><input type="number" id="sell-price" placeholder="1100"></div>
        </div>

        <label>① 買った理由</label>
        <textarea id="buy-reason" placeholder="例：25日移動平均線で反発したから" rows="2"></textarea>
        
        <label>② 売った理由</label>
        <textarea id="sell-reason" placeholder="例：目標の5%利確ラインに達したから" rows="2"></textarea>
        
        <label>③ 今回の学び・反省</label>
        <textarea id="feedback" placeholder="例：もう少し利伸ばしできたかも。" rows="2"></textarea>

        <button onclick="saveTrade()">この内容で保存する</button>
        <button class="btn-sub" onclick="showTab('cal')">キャンセル</button>
    </div>
</div>

<nav class="nav">
    <div class="nav-item active" id="nav-cal" onclick="showTab('cal')">📅<br>日記</div>
    <div class="nav-item" id="nav-stats" onclick="showTab('stats')">📈<br>資産</div>
    <div class="nav-item" id="nav-dict" onclick="showTab('dict')">📖<br>図鑑</div>
</nav>

<script>
    // 図鑑データ（SVGパスで描画）
    const dictData = [
        { name: 'ダブルボトム', type: '買い', desc: 'Wの形。二度底を打って下がらないのは上昇の合図。', path: 'M10,20 L30,60 L50,30 L70,60 L90,10', color: '#e57373' },
        { name: 'ダブルトップ', type: '売り', desc: 'Mの形。二度天井を叩いて超えられないのは下落の予兆。', path: 'M10,60 L30,20 L50,50 L70,20 L90,60', color: '#66bb6a' },
        { name: '押し目買い', type: '用語', desc: '上昇中の株が一時的に安くなった場所で買う、最も王道な手法。' },
        { name: '損切り', type: '用語', desc: 'これ以上負けないために、早めにマイナスを確定させる技術。' },
        { name: 'ナンピン', type: '用語', desc: '下がった時に買い増して平均取得額を下げること。計画的に！' }
    ];

    let trades = JSON.parse(localStorage.getItem('kabu_trades_v5.4') || '{}');
    let holdings = JSON.parse(localStorage.getItem('kabu_holdings_v5.4') || '[]');
    let selectedDate = "", myChart = null;

    function showTab(tab) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        document.getElementById('nav-' + tab).classList.add('active');
        if(tab === 'cal') renderCalendar();
        if(tab === 'stats') { renderStats(); initChart(); updateGrandTotal(); }
        if(tab === 'dict') renderDict();
    }

    function renderCalendar() {
        const cal = document.getElementById('calendar'); cal.innerHTML = "";
        const now = new Date(); const y = now.getFullYear(); const m = now.getMonth();
        const days = new Date(y, m+1, 0).getDate();
        for(let i=1; i<=days; i++){
            const dStr = `${y}-${m+1}-${i}`;
            const el = document.createElement('div');
            el.className = 'day' + (i === now.getDate() ? ' today' : '') + (selectedDate === dStr ? ' selected' : '');
            let p = 0; if(trades[dStr]) trades[dStr].forEach(t => p += t.profit);
            el.innerHTML = `<div class="day-num">${i}</div>` + (p !== 0 ? `<div class="day-profit ${p>0?'p-plus':'p-minus'}">${p>0?'+':''}${p.toLocaleString()}</div>` : "");
            el.onclick = () => { selectedDate = dStr; renderCalendar(); document.getElementById('daily-detail-area').style.display = 'block'; document.getElementById('detail-date').innerText = dStr; renderDayTrades(); };
            cal.appendChild(el);
        }
    }

    function renderDayTrades() {
        const inner = document.getElementById('trade-list-inner'); inner.innerHTML = "";
        const ds = trades[selectedDate] || [];
        if(ds.length === 0) inner.innerHTML = "<p style='color:#ccc;'>記録なし</p>";
        ds.forEach((t, i) => {
            inner.innerHTML += `
                <div class="card" style="border-left:5px solid ${t.profit>=0?'#e57373':'#66bb6a'}">
                    <div style="display:flex; justify-content:space-between; font-weight:bold;"><span>${t.name}</span><span>${t.profit.toLocaleString()}円</span></div>
                    <div style="font-size:0.7rem; color:#666; margin-top:10px; line-height:1.4;">
                        <div><strong>買動機:</strong> ${t.buyReason || '-'}</div>
                        <div><strong>売動機:</strong> ${t.sellReason || '-'}</div>
                        <div><strong>反省:</strong> ${t.feedback || '-'}</div>
                    </div>
                    <button onclick="deleteTrade(${i})" class="btn-sub" style="padding:4px; font-size:0.6rem; width:50px;">削除</button>
                </div>`;
        });
    }

    function saveTrade() {
        const n = document.getElementById('stock-name').value;
        const b = parseFloat(document.getElementById('buy-price').value) || 0;
        const s = parseFloat(document.getElementById('sell-price').value) || 0;
        const br = document.getElementById('buy-reason').value;
        const sr = document.getElementById('sell-reason').value;
        const fb = document.getElementById('feedback').value;

        if(!n) return alert("銘柄名を入れてね");
        if(!trades[selectedDate]) trades[selectedDate] = [];
        trades[selectedDate].push({name:n, profit: s-b, buyReason:br, sellReason:sr, feedback:fb});
        localStorage.setItem('kabu_trades_v5.4', JSON.stringify(trades));
        showTab('cal');
    }

    function renderDict() {
        const container = document.getElementById('dict-container'); container.innerHTML = "<h3>学べる図鑑</h3>";
        dictData.forEach(item => {
            let svg = "";
            if(item.path) {
                svg = `<div class="chart-svg-box"><svg width="100" height="70" viewBox="0 0 100 70"><path d="${item.path}" fill="none" stroke="${item.color}" stroke-width="4" stroke-linecap="round"/></svg></div>`;
            }
            container.innerHTML += `<div class="card"><strong>【${item.type}】${item.name}</strong>${svg}<p style="font-size:0.75rem;">${item.desc}</p></div>`;
        });
    }

    function updateGrandTotal() {
        let total = 0;
        Object.keys(trades).forEach(date => trades[date].forEach(t => total += t.profit));
        document.getElementById('grand-total').innerText = total.toLocaleString() + "円";
    }

    function initChart() {
        const ctx = document.getElementById('profitChart').getContext('2d');
        if(myChart) myChart.destroy();
        const sorted = Object.keys(trades).sort((a,b) => new Date(a) - new Date(b));
        let cum = 0; const ls = [], ds = [];
        sorted.forEach(d => { let dp = 0; trades[d].forEach(t => dp += t.profit); cum += dp; ls.push(d.split('-').slice(1).join('/')); ds.push(cum); });
        myChart = new Chart(ctx, { type: 'line', data: { labels: ls, datasets: [{ data: ds, borderColor: '#ffb7b2', backgroundColor: 'rgba(255,183,178,0.2)', fill: true, tension: 0.3 }] }, options: { plugins: { legend: { display: false } } } });
    }

    function renderStats() {
        const l = document.getElementById('holding-list'); l.innerHTML = "<h3>保有株</h3>";
        holdings.forEach((h, i) => {
            const p = h.current - h.price;
            l.innerHTML += `<div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                <div><strong>${h.name}</strong></div>
                <div><span class="${p>=0?'p-plus':'p-minus'}">${p>=0?'+':''}${p.toLocaleString()}円</span>
                <button onclick="holdings.splice(${i},1); localStorage.setItem('kabu_holdings_v5.4', JSON.stringify(holdings)); renderStats();" class="btn-sub" style="width:40px; padding:2px; font-size:0.5rem;">消</button></div></div>`;
        });
    }

    function addHolding() {
        const n = document.getElementById('hold-name').value, p = document.getElementById('hold-price').value, c = document.getElementById('hold-current').value;
        if(n&&p&&c) { holdings.push({name:n, price:parseFloat(p), current:parseFloat(c)}); localStorage.setItem('kabu_holdings_v5.4', JSON.stringify(holdings)); renderStats(); }
    }

    function deleteTrade(i) { trades[selectedDate].splice(i, 1); if(trades[selectedDate].length===0) delete trades[selectedDate]; localStorage.setItem('kabu_trades_v5.4', JSON.stringify(trades)); renderDayTrades(); renderCalendar(); }
    function openForm() { document.getElementById('tab-cal').classList.remove('active'); document.getElementById('tab-entry').classList.add('active'); document.getElementById('entry-title').innerText = selectedDate + " の記録"; }

    renderCalendar();
</script>
</body>
</html>
